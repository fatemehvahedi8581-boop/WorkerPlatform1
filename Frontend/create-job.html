<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ثبت آگهی جدید | پلتفرم کارگران</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="style.css">
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">پلتفرم کارگران</a>
            <a href="index.html" class="btn btn-outline-light btn-sm">بازگشت به خانه</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                        <h4 class="text-primary mb-0">ثبت آگهی جدید</h4>
                        <p class="text-muted small">این آگهی برای کارگران نمایش داده می‌شود.</p>
                    </div>
                    <div class="card-body p-4">
                        <form id="createJobForm">
                            <div class="mb-3">
                                <label class="form-label">عنوان آگهی</label>
                                <input type="text" class="form-control" id="jobTitle" placeholder="مثلاً: نقاشی ساختمان" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">شهر</label>
                                    <input type="text" class="form-control" id="jobCity" placeholder="مثلاً: تهران" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">قیمت (تومان)</label>
                                    <input type="number" class="form-control" id="jobPrice" placeholder="مثلاً: 500000" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">توضیحات</label>
                                <textarea class="form-control" id="jobDescription" rows="4" placeholder="شرح دقیق کار مورد نظر..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">ثبت آگهی</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="theme.js"></script>
    <script src="create-job.js"></script>
</body>
</html>
