<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلتفرم اتصال کارگران و کارفرمایان</title>
    <!-- استفاده از فونت وزیرمتن و بوت‌استرپ RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">پلتفرم کارگران</a>
            <div class="d-flex align-items-center" id="navActions">
                <!-- محتوای دکمه‌ها با جاوااسکریپت پر می‌شود -->
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <div class="input-group input-group-lg shadow-sm">
                    <input type="text" id="searchInput" class="form-control" placeholder="جستجوی آگهی (مثلاً نقاشی، باغبانی، تهران...)">
                    <button class="btn btn-primary" onclick="loadJobAds()">جستجو</button>
                </div>
            </div>
        </div>

        <h3 class="mb-3 text-secondary">آگهی‌های اخیر</h3>
        <div id="jobAdsContainer" class="row g-4">
            <!-- کارت‌های آگهی اینجا رندر می‌شوند -->
            <div class="col-12 text-center text-muted" id="loadingMessage">در حال بارگذاری...</div>
        </div>
    </div>

    <!-- اسکریپت‌ها -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="theme.js"></script>
    <script src="app.js"></script>
</body>
</html>
