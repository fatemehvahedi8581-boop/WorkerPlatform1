<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>داشبورد | پلتفرم کارگران</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="style.css">
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">پلتفرم کارگران</a>
            <a href="index.html" class="btn btn-outline-light btn-sm">بازگشت به خانه</a>
        </div>
    </nav>

    <div class="container">
        <h3 class="mb-4 text-secondary">پنل کاربری من</h3>
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm border-0 text-center p-4" id="profileCard">
                    <div class="spinner-border text-primary mx-auto"></div>
                </div>
                <div class="card shadow-sm border-0 mt-4" id="skillsCard" style="display: none;">
                    <div class="card-header fw-bold">رزومه مهارتی من</div>
                    <div class="card-body">
                        <form id="skillForm">
                            <div class="mb-2">
                                <label for="skillName" class="form-label">نام مهارت</label>
                                <input id="skillName" class="form-control" placeholder="مثلاً برق‌کاری" required>
                            </div>
                            <div class="mb-2">
                                <label for="skillLevel" class="form-label">سطح مهارت</label>
                                <select id="skillLevel" class="form-select" required>
                                    <option value="Beginner">مبتدی</option>
                                    <option value="Intermediate">متوسط</option>
                                    <option value="Advanced">پیشرفته</option>
                                    <option value="Expert">حرفه‌ای</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="skillDescription" class="form-label">توضیحات</label>
                                <textarea id="skillDescription" class="form-control" rows="2" placeholder="سابقه و توضیح مهارت"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">افزودن مهارت</button>
                        </form>
                        <div id="skillsList" class="mt-3"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold">تاریخچه فعالیت‌ها</div>
                    <div class="card-body" id="historyContainer">
                        <div class="spinner-border text-primary"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="theme.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
